[project]
name = "sentinel2-burn-segmentation"
version = "0.1.0"
description = "Deep learning segmentation of burned areas from Sentinel-2 satellite imagery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "albumentations>=2.0.8",
    "datasets>=3.0",
    "geopandas>=1.1.3",
    "h5py>=3.16.0",
    "hdf5plugin>=6.0.0",
    "numpy>=2.4.4",
    "pyproj>=3.7.2",
    "pyyaml>=6.0.3",
    "rasterio>=1.4.4",
    "scikit-learn>=1.8.0",
    "segmentation-models-pytorch>=0.5.0",
    "shapely>=2.1.2",
    "torch>=2.6.0",
    "torchmetrics>=1.0.3",
    "torchvision>=0.21.0",
    "wandb>=0.18",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "ruff>=0.15.13",
    "seaborn>=0.13.2",
    "tqdm>=4.66.5",
]
